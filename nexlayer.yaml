application:
  name: huly
  pods:
  - name: front
    image: mirror.gcr.io/hardcoreeng/front:latest
    path: /
    servicePorts:
    - 8087
    vars:
      SERVER_PORT: "8083"
      SERVER_SECRET: "huly-server-secret-changeme"
      MONGO_URL: mongodb://mongo.pod:27017
      TITLE: Huly
      DEFAULT_LANGUAGE: en
      # ACCOUNTS_URL must be https:// (not wss://) — Huly converts to WebSocket internally.
      # After deploy, create nexroute routes:
      #   <namespace>-huly-account.cloud.nexlayer.ai / → huly-account-service:3000
      #   <namespace>-huly-collaborator.cloud.nexlayer.ai / → huly-collaborator-service:3078
      #   <namespace>-huly-transactor.cloud.nexlayer.ai / → huly-transactor-service:3333
      # Then patch these env vars to match your namespace.
      ACCOUNTS_URL: "https://relaxed-weasel-huly-account.cloud.nexlayer.ai"
      TRANSACTOR_URL: "wss://relaxed-weasel-huly-transactor.cloud.nexlayer.ai"
      COLLABORATOR_URL: "https://relaxed-weasel-huly-collaborator.cloud.nexlayer.ai"
      BRANDING_URL: "https://huly.app/branding.json"
      MINIO_ENDPOINT: minio.pod
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
  - name: account
    image: mirror.gcr.io/hardcoreeng/account:latest
    servicePorts:
    - 3000
    vars:
      SERVER_PORT: "3000"
      SERVER_SECRET: "huly-server-secret-changeme"
      MONGO_URL: mongodb://mongo.pod:27017
      FRONT_URL: "https://relaxed-weasel-huly-selfhost.cloud.nexlayer.ai"
      TRANSACTOR_URL: "ws://transactor.pod:3333"
      MINIO_ENDPOINT: minio.pod
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
  - name: transactor
    image: mirror.gcr.io/hardcoreeng/transactor:latest
    servicePorts:
    - 3333
    vars:
      SERVER_PORT: "3333"
      SERVER_SECRET: "huly-server-secret-changeme"
      MONGO_URL: mongodb://mongo.pod:27017
      FRONT_URL: "https://relaxed-weasel-huly-selfhost.cloud.nexlayer.ai"
      ACCOUNTS_URL: "ws://account.pod:3000"
      MINIO_ENDPOINT: minio.pod
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
  - name: collaborator
    image: mirror.gcr.io/hardcoreeng/collaborator:latest
    servicePorts:
    - 3078
    vars:
      SERVER_PORT: "3078"
      SERVER_SECRET: "huly-server-secret-changeme"
      MONGO_URL: mongodb://mongo.pod:27017
      ACCOUNTS_URL: "ws://account.pod:3000"
      MINIO_ENDPOINT: minio.pod
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
  - name: minio
    image: mirror.gcr.io/minio/minio:latest
    servicePorts:
    - 9000
    - 9001
    command:
    - server
    - /data
    - --console-address
    - ":9001"
    vars:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
    - name: huly-minio-data
      mountPath: /data
      size: 20Gi
  - name: mongo
    image: mirror.gcr.io/library/mongo:7
    servicePorts:
    - 27017
    volumes:
    - name: huly-db
      mountPath: /data/db
      size: 10Gi
